<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Box</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151b;--panel:#1b202b;--panel2:#252c3b;--line:#323a4d;--text:#f3f5f8;--mute:#9aa4b6;--accent:#4aa3ff;--font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Barlow Condensed','Barlow',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
.rail{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.rail-top{padding:14px 14px 8px;display:flex;gap:8px;align-items:center}
.rail-top h1{font:600 22px var(--num);margin:0;flex:1;letter-spacing:.02em}
.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent)}
.search{margin:0 14px 8px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;width:calc(100% - 28px)}
.chips{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.chip{flex:none;background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--mute);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.list{flex:1;overflow-y:auto;min-height:0;padding-bottom:12px}
.ch{display:grid;grid-template-columns:34px 64px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px 8px 12px;cursor:pointer}
.ch:hover{background:var(--panel2)}
.ch.on{background:var(--panel2);border-left-color:var(--accent)}
.ch .n{font:600 18px var(--num);color:var(--mute);text-align:right}
.logo{height:40px;border-radius:5px;display:grid;place-items:center;font:600 17px var(--num);letter-spacing:.04em;color:#fff}
.ch .t{min-width:0}.ch .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .t small{color:var(--mute)}
.heart{background:none;border:0;cursor:pointer;font-size:18px;color:var(--mute);padding:4px}
.heart.f{color:#ff6b8b}
.empty{padding:24px 16px;color:var(--mute);line-height:1.5}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.video{flex:1;min-height:0;background:#000;position:relative}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ext{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px}
.ext p{margin:0;max-width:44ch;color:var(--mute);line-height:1.5}
.go{background:var(--accent);color:#06121f;font-weight:600;border:0;border-radius:8px;padding:10px 22px;text-decoration:none;cursor:pointer}
.info{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px}
.info .num{font:600 40px var(--num);line-height:1}
.info h2{margin:0;font-size:20px;font-weight:600}
.info .d{color:var(--mute);margin-top:2px;line-height:1.4}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tools label{color:var(--mute);font-size:14px}
select,input[type=text],input[type=url],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;padding:16px;z-index:5}
.modal.open{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(440px,100%);display:grid;gap:12px}
.card h3{margin:0;font:600 22px var(--num)}
.card label{display:grid;gap:4px;color:var(--mute);font-size:14px}
.card .row{display:flex;gap:8px;justify-content:flex-end}
.err{color:#ff8a8a;min-height:1.2em;font-size:14px}
.app.nomenu{grid-template-columns:1fr}.app.nomenu .rail{display:none}
.float{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;opacity:.5;transition:opacity .2s}.float:hover,.float:focus-within{opacity:1}
.float button{background:rgba(18,21,27,.85);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px}

@media (max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .stage{order:-1}.video{flex:none;aspect-ratio:16/9}
 .info{grid-template-columns:1fr;gap:8px}.tools{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* liquid glass */
html{background:#0a0d14}body{background:transparent}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;opacity:.6;filter:blur(30px);background:radial-gradient(40% 35% at 15% 20%,#3b6dff,transparent 70%),radial-gradient(35% 35% at 85% 15%,#c04cff,transparent 70%),radial-gradient(40% 40% at 70% 90%,#00c2b8,transparent 70%),radial-gradient(30% 30% at 10% 90%,#ff7a59,transparent 70%)}
.app{padding:14px;gap:14px}.stage{gap:14px}
.rail,.info,.card{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 40px rgba(0,0,0,.35)}
.rail{border-radius:28px;overflow:hidden}.info{border-radius:24px}.card{border-radius:28px}
.video{border-radius:24px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.icon-btn,.search,select,.chip,input[type=text],input[type=url],textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
textarea{border-radius:14px}.rail-top .icon-btn{padding:6px 10px;font-size:14px}
.chip[aria-pressed=true]{background:rgba(255,255,255,.92);color:#10131a;border-color:transparent}
.ch{border-left:0;margin:2px 8px;width:calc(100% - 16px);border-radius:18px}
.ch:hover{background:rgba(255,255,255,.08)}
.ch.on{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.25)}
.logo{border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.go{border-radius:99px;background:rgba(255,255,255,.92)}
.float button{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:50%;border-color:rgba(255,255,255,.3)}
.modal{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mv{display:flex;gap:3px}.mv span{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);font-size:12px}.mv span:hover{background:rgba(255,255,255,.28)}
/* full-bleed layout */
body::before{display:none}
.app{display:block;position:fixed;inset:0;padding:0;gap:0;--ih:96px}
.stage{position:fixed;inset:0;display:block;z-index:1;gap:0}
.video{position:absolute;inset:0;flex:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#000}
.scrim{position:absolute;inset:0;z-index:1;display:none}.app.menu .scrim{display:block}
.edge{position:absolute;left:0;top:0;bottom:0;width:16px;z-index:2}
.float{z-index:4;left:auto;right:12px}
.rail{position:absolute;z-index:5;left:14px;top:14px;bottom:calc(var(--ih) + 28px);width:min(340px,calc(100% - 28px));transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
.app.menu .rail{transform:none;opacity:1;pointer-events:auto}
.info{position:absolute;z-index:3;left:14px;right:14px;bottom:14px;opacity:0;transform:translateY(20px);pointer-events:none;transition:transform .3s,opacity .3s}
.app.menu .info,.app.hud .info{opacity:1;transform:none}.app.menu .info{pointer-events:auto}
@media (max-width:760px){.app{--ih:190px}}
</style>
</head>
<body>
<div class="app">
 <aside class="rail">
  <div class="rail-top"><h1>TV Box</h1><button class="icon-btn" id="ord">Reorder</button><button class="icon-btn" id="add">+ Add</button></div>
  <input class="search" id="q" type="text" placeholder="Search channels" aria-label="Search channels">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
 </aside>
 <main class="stage">
  <div class="float"><button id="menub" aria-label="Show or hide menu" title="Menu (M)">☰</button><button id="fsb" aria-label="Full screen" title="Full screen (F)">⛶</button></div>
  <div class="video" id="video"></div>
  <div class="scrim" id="scrim"></div><div class="edge" id="edge"></div>
  <div class="info">
   <div class="num" id="inum"></div>
   <div><h2 id="iname"></h2><div class="d" id="idesc"></div></div>
   <div class="tools">
    <label for="qual">Quality</label>
    <select id="qual"><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="auto">Auto</option></select>
    <button class="icon-btn" id="fav" aria-label="Toggle favourite">♡</button>
    <button class="icon-btn" id="del">Remove</button>
    <a class="icon-btn" id="open" href="#" target="_blank" rel="noopener" style="text-decoration:none">Open ↗</a>
   </div>
  </div>
 </main>
</div>

<div class="modal" id="modal"><div class="card" role="dialog" aria-labelledby="mt">
 <h3 id="mt">Add a channel</h3>
 <label>Livestream link<input type="url" id="f-url" placeholder="Paste a link or YouTube embed code"></label>
 <label>Channel name<input type="text" id="f-name" maxlength="40"></label>
 <label>Category<input type="text" id="f-cat" list="cats" maxlength="24" placeholder="News, 新聞, Music, Kids, 臺灣"></label>
 <datalist id="cats"></datalist>
 <label>Short description<textarea id="f-desc" rows="2" maxlength="120"></textarea></label>
 <div class="err" id="err"></div>
 <div class="row"><button class="icon-btn" id="cancel">Cancel</button><button class="go" id="save">Add channel</button></div>
</div></div>

<script>
const D=[
['cna','CNA','News','https://www.youtube.com/live/-PWMxjBgr0k?si=T0boxcibhUSUEfF3','Asia-focused 24/7 news from Singapore.'],
['cnao','CNA Originals','News','https://www.youtube.com/watch?v=9Y4kOQk_K3Y','Documentaries and features from CNA.'],
['bbg','Bloomberg Television','News','https://www.youtube.com/watch?v=QB5BNdBFujE','Markets, business and economy.'],
['bb0','Bloomberg Originals','News','https://www.youtube.com/live/DxmDPrfinXY?si=11kgajwEar211G4V','Markets, business and economy.'],
['tvbs','TVBS 新聞','新聞','https://www.youtube.com/live/2mCSYvcfhtc?si=kpjj3BkdZRjWmJ2V','TVBS新聞'],
['ttv','台視新聞','新聞','https://www.youtube.com/live/9iRAqBMakXY?si=ulUCtiFb4F4P85x0','台視新聞'],
['san','三立新聞','新聞','https://www.youtube.com/live/hGJkDZDchYI?si=QOSAFTOCSUlAyi0A','三立新聞'],
['ebc','東森新聞','新聞','https://www.youtube.com/live/V1p33hqPrUk?si=JCofko83aLC0L4oX','東森新聞'],
['cti','中天新聞','新聞','https://www.youtube.com/live/vr3XyVCR4T0?si=lwbfK4AnHnYlkQYs','中天新聞'],
['cts','華視新聞','新聞','https://www.youtube.com/live/wM0g8EoUZ_E?si=KT_7huh7sjWo-X-r','華視新聞'],
['ftv','民視新聞','新聞','https://www.youtube.com/live/ylYJSBUgaMA?si=2UZS-KxVZT4X9J_f','民視新聞'],
['abc','ABC News','News','https://www.youtube.com/watch?v=KQhNZQ_Uag8','US and world news.'],
['nbc','NBC News','News','https://www.youtube.com/watch?v=C5BUYsiW9n4','Breaking news and analysis.'],
['cbs','CBS News','News','https://www.youtube.com/watch?v=tvl69iYzlKQ','24/7 US and global coverage.'],
['cgtn','CGTN','News','https://www.youtube.com/watch?v=0i7n3r01L2U','China Global Television Network in English.'],
['aja','Al Jazeera','News','https://www.youtube.com/watch?v=gCNeDWCI0vo','International news from Doha.'],
['cnn','CNN','News','https://www.youtube.com/watch?v=GotlA1KKWoo','Live news from CNN.'],
['awa','Astro Awani','News','https://www.youtube.com/watch?v=mkVyNaGee8A','Malaysian news in Bahasa Melayu.'],
['acm','Animal Crossing Music','Music','https://www.youtube.com/watch?v=5RuM_n8lCRU','Relaxing Animal Crossing soundtrack.'],
['snm','Snoopy Music','Music','https://www.youtube.com/watch?v=XPIS0XA5lpk','Cosy Snoopy-themed music.'],
['pnf','Phineas and Ferb','Kids','https://www.youtube.com/watch?v=_HviSyC7zSU','Summer-vacation adventures, non-stop.'],
['blu','Bluey','Kids','https://www.youtube.com/watch?v=RHUauMcYlX0','Bluey episodes for the whole family.'],
['blt','Baby Looney Tunes','Kids','https://www.youtube.com/live/XfZetbS9084?si=PzS8md_D9kAcQtSJ','The best Baby Looney Tunes episodes with fun stories, imaginative play, teamwork and more.'],
['ssp','Spongebob','Kids','https://www.youtube.com/live/PU4emHQmC2o?si=FffXo24ZhrtRno69','Kick back with the Krusty Krab crew and celebrate all of SpongeBob.'],
['mrb','Animated Mr Bean','Kids','https://www.youtube.com/live/oPonPGALYaU?si=xjXHppnCHSM2JFoI','Mr Bean Animated.'],
['gfc','Garfield','Kids','https://www.youtube.com/live/2Vf5RcQ84z0?si=Tm542iWP75rg2Nvd','Garfield.'],
['cg','Curious George','Kids','https://www.youtube.com/live/usb1eiARplQ?si=LJ0OTXV7bRLTc_Fo','Curious George.'],
['ebcv','東森綜合2台','臺灣','https://www.youtube.com/live/cimbpAZUjzw?si=J3uIL3N5EKUz6Doe','東森綜合2台'],
['hdn','綜藝大熱門','臺灣','https://www.youtube.com/live/5I-1d5lZ3EE?si=4K1AHcn7eiHRGG3u','綜藝大熱門'],
['zwd','綜藝玩很大','臺灣','https://www.youtube.com/live/iKXmK_l2EeA?si=e7w2VFDI_dwDdrcW','綜藝玩很大'],
['zyd','綜藝大集會','臺灣','https://www.youtube.com/live/xQwzLc7hWOI?si=6d_3lBvXtfSsn_4e','綜藝大集會']
].map(a=>({id:a[0],name:a[1],cat:a[2],url:a[3],desc:a[4]}));

const KEY='myChannels.v1';
let S={custom:[],favs:[],removed:[],last:'cna',q:'1080',order:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cat='All',term='',cur=null,first=true,edit=false;
const $=id=>document.getElementById(id);
const all=()=>{const o=S.order||[],ix=c=>{const i=o.indexOf(c.id);return i<0?1e6:i};return D.concat(S.custom).filter(c=>!S.removed.includes(c.id)).sort((a,b)=>ix(a)-ix(b))};

function ytId(u){try{const x=new URL(u),h=x.hostname.replace('www.','');
 if(h==='youtu.be')return x.pathname.slice(1)||null;
 if(h.endsWith('youtube.com')){if(x.searchParams.get('v'))return x.searchParams.get('v');
  const m=x.pathname.match(/^\/(live|embed|shorts)\/([\w-]+)/);return m?m[2]:null}}catch(e){}return null}
function tile(name){let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))%360;
 const w=name.split(/\s+/);const ini=(w.length>1?w[0][0]+w[1][0]:name.slice(0,3)).toUpperCase();
 return `<div class="logo" style="background:hsl(${h} 42% 34%)">${ini}</div>`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function visible(){const a=all();return a.filter(c=>(cat==='All'||(cat==='Favourites'?S.favs.includes(c.id):c.cat===cat))&&(c.name+' '+c.desc+' '+c.cat).toLowerCase().includes(term))}
function renderChips(){const cats=['All','Favourites',...new Set(all().map(c=>c.cat))];
 $('chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 $('cats').innerHTML=[...new Set(all().map(c=>c.cat))].map(c=>`<option value="${esc(c)}">`).join('')}
function renderList(){const a=all(),v=visible();
 $('list').innerHTML=v.length?v.map(c=>`<button class="ch ${cur&&cur.id===c.id?'on':''}" data-id="${c.id}"><span class="n">${a.indexOf(c)+1}</span>${tile(c.name)}<span class="t"><b>${esc(c.name)}</b><small>${esc(c.cat)}</small></span>${edit?'<span class="mv"><span data-m="top" role="button" aria-label="Move to top" title="Move to top">⤒</span><span data-m="-1" role="button" aria-label="Move up">▲</span><span data-m="1" role="button" aria-label="Move down">▼</span></span>':`<span class="heart ${S.favs.includes(c.id)?'f':''}" data-h="${c.id}" role="button" aria-label="Favourite">${S.favs.includes(c.id)?'♥':'♡'}</span>`}</button>`).join(''):'<div class="empty">No channels here yet. Use “+ Add” to paste a livestream link.</div>'}

function play(id,user){const a=all();cur=a.find(c=>c.id===id)||a[0];if(!cur){$('video').innerHTML='<div class="ext"><p>No channels left. Add one to start watching.</p></div>';return}
 S.last=cur.id;save();
 $('inum').textContent=a.indexOf(cur)+1;$('iname').textContent=cur.name;$('idesc').textContent=cur.cat+' · '+cur.desc;
 $('open').href=cur.url;$('fav').textContent=S.favs.includes(cur.id)?'♥':'♡';
 const y=ytId(cur.url),v=$('video');
 $('qual').disabled=!y;
 if(y){const vq={1080:'hd1080',720:'hd720',480:'large'}[S.q];
  v.innerHTML=`<iframe title="${esc(cur.name)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen src="https://www.youtube.com/embed/${y}?autoplay=1&rel=0&playsinline=1${vq?'&vq='+vq+'&hd=1':''}${first&&!user?'&mute=1':''}"></iframe>`}
 else v.innerHTML=`<div class="ext"><h2>${esc(cur.name)}</h2><p>${esc(cur.desc)} This broadcaster doesn’t allow its stream to be embedded, so it plays on its own site.</p><a class="go" href="${esc(cur.url)}" target="_blank" rel="noopener">Watch on ${esc(new URL(cur.url).hostname.replace('www.',''))}</a></div>`;
 first=false;renderList();hud()}

function zap(d){const v=visible();if(!v.length)return;const i=v.findIndex(c=>c.id===(cur&&cur.id));play(v[(i+d+v.length)%v.length].id,true);
 const el=document.querySelector('.ch.on');if(el)el.scrollIntoView({block:'nearest'})}

$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;renderChips();renderList()};
$('q').oninput=e=>{term=e.target.value.toLowerCase();renderList()};
$('list').onclick=e=>{const mv=e.target.closest('[data-m]');if(mv){e.stopPropagation();move(mv.closest('.ch').dataset.id,mv.dataset.m);return}
 const h=e.target.closest('[data-h]');
 if(h){e.stopPropagation();const id=h.dataset.h,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();$('fav').textContent=cur&&S.favs.includes(cur.id)?'♥':'♡';renderList();return}
 const b=e.target.closest('.ch');if(b)play(b.dataset.id,true)};
$('qual').onchange=e=>{S.q=e.target.value;save();play(cur.id,true)};
$('fav').onclick=()=>{if(!cur)return;const i=S.favs.indexOf(cur.id);i<0?S.favs.push(cur.id):S.favs.splice(i,1);save();$('fav').textContent=S.favs.includes(cur.id)?'♥':'♡';renderList()};
$('del').onclick=()=>{if(!cur||!confirm('Remove “'+cur.name+'” from your list?'))return;const c=cur;
 if(S.custom.some(x=>x.id===c.id))S.custom=S.custom.filter(x=>x.id!==c.id);else S.removed.push(c.id);
 save();renderChips();play(all()[0]&&all()[0].id,true)};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('modal').classList.contains('open'))return;
 if(e.key==='m')setMenu(!app.classList.contains('menu'));if(e.key==='f')fs(!document.body.classList.contains('fs'));if(e.key==='Escape')setMenu(false);if(e.key==='ArrowDown'){e.preventDefault();zap(1)}if(e.key==='ArrowUp'){e.preventDefault();zap(-1)}});

const openM=()=>{['f-url','f-name','f-cat','f-desc'].forEach(i=>$(i).value='');$('err').textContent='';$('modal').classList.add('open');$('f-url').focus()};
const closeM=()=>$('modal').classList.remove('open');
$('add').onclick=openM;$('cancel').onclick=closeM;
$('modal').onclick=e=>{if(e.target===$('modal'))closeM()};
$('f-url').onblur=()=>{if(!$('f-name').value){try{const h=new URL($('f-url').value).hostname.replace('www.','');if(!ytId($('f-url').value))$('f-name').value=h.split('.')[0]}catch(e){}}};
$('save').onclick=()=>{const raw=$('f-url').value.trim();if(/<video/i.test(raw)){$('err').textContent='That video code only works inside your own tab. Paste the channel page link instead.';return}
 const m=raw.match(/src="([^"]+)"/),url=m?m[1]:raw,name=$('f-name').value.trim();
 try{const u=new URL(url);if(!/^https?:$/.test(u.protocol))throw 0}catch(e){$('err').textContent='Paste a full link starting with https://';return}
 if(!name){$('err').textContent='Give the channel a name.';return}
 const c={id:'u'+Date.now(),name,cat:$('f-cat').value.trim()||'Other',url,desc:$('f-desc').value.trim()||'Added by me.'};
 S.custom.push(c);save();closeM();cat='All';term='';$('q').value='';renderChips();play(c.id,true)};

const app=document.querySelector('.app');
let hudT,menuT;function setMenu(on){app.classList.toggle('menu',on);if(on)app.classList.remove('hud');pokeMenu()}
function pokeMenu(){clearTimeout(menuT);if(app.classList.contains('menu'))menuT=setTimeout(()=>{if($('modal').classList.contains('open'))return pokeMenu();setMenu(false)},10000)}
['pointerdown','keydown','wheel','touchstart','input','scroll'].forEach(t=>app.addEventListener(t,pokeMenu,true));document.querySelector('.rail').addEventListener('pointermove',pokeMenu);
function hud(){if(app.classList.contains('menu'))return;app.classList.add('hud');clearTimeout(hudT);hudT=setTimeout(()=>app.classList.remove('hud'),4000)}
$('menub').onclick=()=>setMenu(!app.classList.contains('menu'));$('scrim').onclick=()=>setMenu(false);$('edge').onmouseenter=()=>setMenu(true);
function fs(on){document.body.classList.toggle('fs',on);$('fsb').textContent=on?'✕':'⛶';
 try{if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}}
$('fsb').onclick=()=>fs(!document.body.classList.contains('fs'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs'))fs(false)});

function move(id,d){const ids=all().map(c=>c.id),v=visible().map(c=>c.id),a=ids.indexOf(id);
 if(d==='top'){ids.splice(a,1);ids.unshift(id)}else{const t=v[v.indexOf(id)+Number(d)];if(t===undefined)return;const b=ids.indexOf(t);[ids[a],ids[b]]=[ids[b],ids[a]]}
 S.order=ids;save();renderList();if(cur)$('inum').textContent=all().indexOf(cur)+1}
$('ord').onclick=()=>{edit=!edit;$('ord').textContent=edit?'Done':'Reorder';renderList()};
$('qual').value=S.q;renderChips();play(S.last,false);
</script>
</body>
</html>
